[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poly-paper-trader"
version = "0.1.0"
description = "Autonomous high-EV Polymarket paper-trading bot with Weather Ensemble, NegRisk Arbitrage, realistic CLOB orderbook simulation, and Brier Score validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
poly-paper = "poly_paper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
